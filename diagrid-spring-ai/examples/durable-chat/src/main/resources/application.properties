spring.application.name=durable-chat

# ── LLM: OpenAI via Spring AI ────────────────────────────────────────────────
# Export OPENAI_API_KEY in the environment.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini

# No-key alternative: point the OpenAI SDK at a local Ollama (note the /v1 — the openai-java SDK
# appends /chat/completions to the base-url). Uncomment to use a local model:
#   spring.ai.openai.base-url=http://localhost:11434/v1
#   spring.ai.openai.api-key=ollama
#   spring.ai.openai.chat.model=llama3.1:8b
