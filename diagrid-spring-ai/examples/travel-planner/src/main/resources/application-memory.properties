# Profile: memory — persist Spring AI ChatMemory in a Dapr state store (agent-memory) instead of the
# in-process map, so TravelConcierge's stored /chat history survives restarts. Requires a Dapr sidecar.
# The save after each turn is not yet part of the workflow: it runs in the app after the workflow returns.
# The store name matches the managed 'agent-memory' store in Catalyst.
diagrid.spring-ai.memory.enabled=true
diagrid.spring-ai.memory.statestore=agent-memory
